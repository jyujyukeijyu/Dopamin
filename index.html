<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>脳汁枯渇度＆ドーパミン中毒レベル診断</title>

  <!-- OGP設定（Xのポストでサムネイル付きリンクカードを出す用） -->
  <meta property="og:title" content="脳汁枯渇度＆ドーパミン中毒レベル診断" />
  <meta property="og:description" content="全5問・30秒であなたの脳の報酬系バグ度とドーパミンタイプを診断！" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://jyujyuwaraiai.github.io/Dopamin/" />
  <meta property="og:image" content="https://jyujyuwaraiai.github.io/Dopamin/images/banner.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="脳汁枯渇度＆ドーパミン中毒レベル診断" />
  <meta name="twitter:description" content="全5問・30秒であなたの脳の報酬系バグ度とドーパミンタイプを診断！" />
  <meta name="twitter:image" content="https://jyujyuwaraiai.github.io/Dopamin/images/banner.png" />

  <style>
    :root {
      --bg: #0d0e15;
      --card: #171926;
      --border: #2a2e45;
      --text: #f0f2f8;
      --muted: #9aa0b8;
      --accent1: #a855f7;
      --accent2: #f97316;
      --grad: linear-gradient(135deg, var(--accent1), var(--accent2));
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      background: radial-gradient(circle at top, #1b1530 0%, var(--bg) 60%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 24px 16px 48px;
      line-height: 1.65;
    }

    .container {
      width: 100%;
      max-width: 600px;
    }

    .badge {
      display: inline-block;
      background: rgba(168, 85, 247, 0.16);
      border: 1px solid rgba(168, 85, 247, 0.45);
      color: #d8b4fe;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 12px;
      letter-spacing: 0.04em;
    }

    h1 {
      font-size: 26px;
      font-weight: 800;
      line-height: 1.35;
      margin-bottom: 12px;
      background: var(--grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .lead {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 20px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px 20px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
    }

    .hidden {
      display: none !important;
    }

    .hero-img,
    .result-img {
      width: 100%;
      max-height: 300px;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-bottom: 18px;
      display: block;
      background: #121420;
    }

    /* Progress */
    .progress-wrap {
      margin-bottom: 20px;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      background: #23273a;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--grad);
      transition: width 0.25s ease;
    }

    /* Question */
    .q-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 18px;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .opt-btn {
      width: 100%;
      text-align: left;
      background: #1e2233;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 15px;
      cursor: pointer;
      transition: transform 0.12s ease, border-color 0.15s ease, background 0.15s ease;
    }

    .opt-btn:hover {
      border-color: var(--accent1);
      background: #262b40;
      transform: translateY(-1px);
    }

    /* Buttons */
    .btn-primary {
      display: block;
      width: 100%;
      text-align: center;
      background: var(--grad);
      color: #fff;
      font-weight: 800;
      font-size: 16px;
      padding: 15px 20px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 6px 20px rgba(168, 85, 247, 0.35);
      transition: opacity 0.15s ease, transform 0.12s ease;
    }

    .btn-primary:hover {
      opacity: 0.94;
      transform: translateY(-1px);
    }

    .btn-x {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      background: #000000;
      color: #ffffff;
      border: 1px solid #33384d;
      font-weight: 700;
      font-size: 15px;
      padding: 13px 18px;
      border-radius: 12px;
      cursor: pointer;
      margin-top: 12px;
      transition: background 0.15s ease;
    }

    .btn-x:hover {
      background: #14171f;
    }

    .btn-ghost {
      display: block;
      width: 100%;
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      font-size: 14px;
      padding: 11px 16px;
      border-radius: 12px;
      cursor: pointer;
      margin-top: 12px;
    }

    .btn-ghost:hover {
      color: var(--text);
      border-color: #464d70;
    }

    /* Result */
    .score-box {
      text-align: center;
      padding: 16px;
      background: #121420;
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 18px;
    }

    .score-label {
      font-size: 12px;
      color: var(--muted);
    }

    .score-num {
      font-size: 36px;
      font-weight: 900;
      background: var(--grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.25;
      margin: 4px 0;
    }

    .rank-title {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 10px;
      color: #fff;
    }

    .rank-desc {
      font-size: 14px;
      color: #d3d7e8;
      margin-bottom: 20px;
    }

    .upsell-box {
      background: linear-gradient(180deg, rgba(168, 85, 247, 0.12), rgba(249, 115, 22, 0.08));
      border: 1px solid rgba(168, 85, 247, 0.45);
      border-radius: 14px;
      padding: 18px 16px;
      margin-top: 20px;
    }

    .upsell-title {
      font-size: 15px;
      font-weight: 800;
      color: #f3e8ff;
      margin-bottom: 8px;
    }

    .upsell-list {
      font-size: 13px;
      color: #d6d9ea;
      padding-left: 18px;
      margin-bottom: 14px;
    }

    .upsell-list li {
      margin-bottom: 4px;
    }

    .note {
      font-size: 11px;
      color: var(--muted);
      text-align: center;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- スタート画面 -->
    <div id="start-screen" class="card">
      <img src="images/banner.png" alt="脳汁枯渇度＆ドーパミン中毒レベル診断バナー" class="hero-img" />
      <span class="badge">所要時間 30秒 / 全5問</span>
      <h1>脳汁枯渇度＆ドーパミン中毒レベル診断</h1>
      <p class="lead">
        SNS・ショート動画・ゲーム・通知の刺激に脳の報酬系がどれくらいハックされているかを25点満点で測定します。
      </p>
      <button class="btn-primary" onclick="startQuiz()">診断をスタートする</button>
    </div>

    <!-- 質問画面 -->
    <div id="quiz-screen" class="card hidden">
      <div class="progress-wrap">
        <div class="progress-meta">
          <span id="q-counter">質問 1 / 5</span>
          <span id="q-percent">20%</span>
        </div>
        <div class="progress-bar">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
      </div>
      <div id="q-title" class="q-title"></div>
      <div id="options" class="options"></div>
    </div>

    <!-- 結果画面 -->
    <div id="result-screen" class="card hidden">
      <img id="result-img" src="images/result_eco.png" alt="診断結果イラスト" class="result-img" />

      <div class="score-box">
        <div class="score-label">あなたの脳汁枯渇度スコア</div>
        <div id="score-num" class="score-num">5 / 25 点</div>
        <div id="rank-badge" class="badge" style="margin-bottom:0;">診断完了</div>
      </div>

      <div id="rank-title" class="rank-title"></div>
      <p id="rank-desc" class="rank-desc"></p>

      <!-- Xシェアボタン（確実にリンク付きでポストを開く） -->
      <button class="btn-x" onclick="shareOnX()">
        <span>𝕏</span> 診断結果とリンクをポストする
      </button>

      <!-- 100円アップセル導線 -->
      <div class="upsell-box">
        <div class="upsell-title">🔓 辛口裏コメント＆即効・集中力ハック（100円）</div>
        <ul class="upsell-list">
          <li>あなたのタイプ専用の「容赦ない辛口裏診断」</li>
          <li>枯渇した報酬系をリセットする72時間プロトコル</li>
          <li>作業・勉強・制作に脳汁を向ける環境ハック集</li>
        </ul>
        <a id="stripe-link" class="btn-primary" href="#" target="_blank" rel="noopener noreferrer">
          詳細レポートを見る（100円 / Stripe）
        </a>
        <div class="note">※ 決済完了後、自動的に限定レポートページへ移動します</div>
      </div>

      <button class="btn-ghost" onclick="resetQuiz()">もう一度診断する</button>
    </div>
  </div>

  <script>
    const SITE_URL = "https://jyujyuwaraiai.github.io/Dopamin/";
    const STRIPE_PAYMENT_LINK = "https://buy.stripe.com/test_7sY4grdv3fxj5EkcVrgUM00";

    const QUESTIONS = [
      "朝起きて最初にする行動はスマホの通知やSNSチェックだ",
      "5分以上の長文や長い動画を見る前に、倍速やスキップをしたくなる",
      "作業や勉強中、15分に1回は別タブやスマホを触ってしまう",
      "何もしていない静かな時間（移動中やトイレ等）に強いソワソワ感がある",
      "SNSの『いいね』や返信、ゲームの演出がないと達成感を感じにくい"
    ];

    const CHOICES = [
      { label: "まったく当てはまらない", point: 1 },
      { label: "あまり当てはまらない", point: 2 },
      { label: "どちらともいえない", point: 3 },
      { label: "やや当てはまる", point: 4 },
      { label: "かなり当てはまる", point: 5 }
    ];

    let currentIdx = 0;
    let totalScore = 0;
    let currentResult = null;

    document.getElementById("stripe-link").href = STRIPE_PAYMENT_LINK;

    function startQuiz() {
      currentIdx = 0;
      totalScore = 0;
      document.getElementById("start-screen").classList.add("hidden");
      document.getElementById("result-screen").classList.add("hidden");
      document.getElementById("quiz-screen").classList.remove("hidden");
      renderQuestion();
    }

    function renderQuestion() {
      const qNum = currentIdx + 1;
      const pct = Math.round((qNum / QUESTIONS.length) * 100);
      document.getElementById("q-counter").textContent = `質問 ${qNum} / ${QUESTIONS.length}`;
      document.getElementById("q-percent").textContent = `${pct}%`;
      document.getElementById("progress-fill").style.width = `${pct}%`;
      document.getElementById("q-title").textContent = QUESTIONS[currentIdx];

      const optionsEl = document.getElementById("options");
      optionsEl.innerHTML = "";
      CHOICES.forEach((choice) => {
        const btn = document.createElement("button");
        btn.className = "opt-btn";
        btn.textContent = choice.label;
        btn.onclick = () => {
          totalScore += choice.point;
          currentIdx++;
          if (currentIdx < QUESTIONS.length) {
            renderQuestion();
          } else {
            showResult();
          }
        };
        optionsEl.appendChild(btn);
      });
    }

    function getDiagnosis(score) {
      if (score <= 9) {
        return {
          score,
          image: "images/result_eco.png",
          rank: "LV.1 省エネ・安定モード",
          title: "ドーパミン省エネ・クールダウン型",
          desc: "刺激に振り回されず、脳のエネルギーを温存できている安定状態です。静かな環境でも落ち着いて思考できるため、腰を据えた作業や制作に向いています。"
        };
      } else if (score <= 14) {
        return {
          score,
          image: "images/result_craft.png",
          rank: "LV.2 職人コントロール型",
          title: "ドーパミン職人・一点集中クラフト型",
          desc: "普段は自分のペースで集中を作れますが、スマホや通知の誘惑が視界に入ると少しずつ作業メモリを削られやすいタイプです。環境を少し整えるだけで化けます。"
        };
      } else if (score <= 19) {
        return {
          score,
          image: "images/result_wave.png",
          rank: "LV.3 高頻度サーファー型",
          title: "ドーパミン荒波・スナック刺激サーファー型",
          desc: "次々と流れてくるタイムラインやショート動画の波に乗り続ける状態に慣れています。刺激がないと退屈を感じやすいため、意識的なデジタル遮断が効きます。"
        };
      } else {
        return {
          score,
          image: "images/result_high.png",
          rank: "LV.4 脳汁オーバーヒート型",
          title: "ドーパミン爆裂・高刺激ハイテンション中毒型",
          desc: "常に強い刺激や即時報酬を求め続けており、脳の報酬系がオーバーヒート気味です。気合いで我慢するよりも、物理的に刺激を断つ72時間リセットが必要です。"
        };
      }
    }

    function showResult() {
      document.getElementById("quiz-screen").classList.add("hidden");
      document.getElementById("result-screen").classList.remove("hidden");

      currentResult = getDiagnosis(totalScore);
      const imgEl = document.getElementById("result-img");
      imgEl.src = currentResult.image;
      imgEl.alt = currentResult.title;

      document.getElementById("score-num").textContent = `${currentResult.score} / 25 点`;
      document.getElementById("rank-badge").textContent = currentResult.rank;
      document.getElementById("rank-title").textContent = `【${currentResult.title}】`;
      document.getElementById("rank-desc").textContent = currentResult.desc;
    }

    function shareOnX() {
      if (!currentResult) return;
      const text =
        `【脳汁枯渇度＆ドーパミン中毒レベル診断】\n` +
        `結果は【${currentResult.title}】（${currentResult.score}/25点）でした！\n` +
        `#脳汁診断`;
      const shareUrl =
        `https://x.com/intent/tweet` +
        `?text=${encodeURIComponent(text)}` +
        `&url=${encodeURIComponent(SITE_URL)}`;
      window.open(shareUrl, "_blank", "noopener,noreferrer");
    }

    function resetQuiz() {
      startQuiz();
    }
  </script>
</body>
</html>
